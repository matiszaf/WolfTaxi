plugins {
    id 'com.android.application'
}

import java.util.Properties

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def apiBaseUrl = localProps.getProperty('wolftaxi.apiUrl', '').trim()
def escapedApiBaseUrl = apiBaseUrl.replace('\\', '\\\\').replace('"', '\\"')

def versionCodeFromEnv = System.getenv('WOLFTAXI_VERSION_CODE') ?: '5'
def versionNameFromEnv = System.getenv('WOLFTAXI_VERSION_NAME') ?: '0.9.0-full-panel-app'

def releaseKeystorePath = System.getenv('WOLFTAXI_KEYSTORE_PATH') ?: ''
def releaseStorePassword = System.getenv('WOLFTAXI_KEYSTORE_PASSWORD') ?: ''
def releaseKeyAlias = System.getenv('WOLFTAXI_KEY_ALIAS') ?: ''
def releaseKeyPassword = System.getenv('WOLFTAXI_KEY_PASSWORD') ?: ''
def releaseSigningReady = !releaseKeystorePath.isEmpty() &&
        !releaseStorePassword.isEmpty() &&
        !releaseKeyAlias.isEmpty() &&
        !releaseKeyPassword.isEmpty()
def requestedReleaseTask = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}

if (requestedReleaseTask && !releaseSigningReady) {
    throw new GradleException('Brak stabilnego podpisu WolfTaxi. Ustaw WOLFTAXI_KEYSTORE_PATH, WOLFTAXI_KEYSTORE_PASSWORD, WOLFTAXI_KEY_ALIAS i WOLFTAXI_KEY_PASSWORD.')
}

android {
    namespace 'pl.wolftaxi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.wolftaxi.app'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(versionCodeFromEnv)
        versionName versionNameFromEnv
        buildConfigField 'String', 'API_BASE_URL', '"' + escapedApiBaseUrl + '"'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
